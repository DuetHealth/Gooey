name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        run: >
          xcodebuild test
          -scheme Gooey
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -quiet
